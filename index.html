<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2f4a3a">
  <title>Familia Valenverguer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Pantalla de acceso -->
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="login-emblem" aria-hidden="true">🌳</div>
      <h1>Familia Valenverguer</h1>
      <p class="muted">Árbol genealógico familiar</p>
      <label class="field">
        <span>Contraseña</span>
        <span class="password-wrap">
          <input id="password" type="password" autocomplete="current-password" required>
          <button id="toggle-password" class="password-toggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña">
            <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </span>
      </label>
      <p id="login-error" class="error" hidden>Contraseña incorrecta</p>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      <p id="login-mode" class="hint" hidden>Modo local: los datos se guardan solo en este navegador.
        Configura Supabase en <code>js/config.js</code> para compartirlos.</p>
    </form>
  </main>

  <!-- Aplicación -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand"><span aria-hidden="true">🌳</span> <span class="brand-text">Familia Valenverguer</span></div>
      <div class="search">
        <input id="search" type="search" placeholder="Buscar persona…" aria-label="Buscar persona" autocomplete="off">
        <ul id="search-results" class="search-results" hidden></ul>
      </div>
      <button id="add-person" class="btn btn-primary" type="button"><span aria-hidden="true">+</span><span class="hide-sm"> Persona</span></button>
      <button id="logout" class="icon-btn" type="button" title="Salir" aria-label="Salir"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </header>

    <div class="workspace">
      <div id="tree" class="tree-viewport" tabindex="-1">
        <div id="empty" class="empty" hidden>
          <p>El árbol está vacío.</p>
          <button id="empty-add" class="btn btn-primary" type="button">Agregar la primera persona</button>
        </div>
      </div>
      <div class="zoom-controls">
        <button id="zoom-in" class="icon-btn" type="button" aria-label="Acercar">+</button>
        <button id="zoom-out" class="icon-btn" type="button" aria-label="Alejar">−</button>
        <button id="zoom-fit" class="icon-btn" type="button" aria-label="Ver todo el árbol" title="Ver todo">⤢</button>
      </div>
      <aside id="panel" class="panel" aria-label="Ficha de la persona"></aside>
    </div>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
